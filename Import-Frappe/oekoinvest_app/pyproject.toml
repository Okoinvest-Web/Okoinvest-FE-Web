[project]
name = "oekoinvest_app"
authors = [{ name = "ÖkoInvest GmbH" }]
description = "Plattform-Backend der ÖkoInvest-Website (Portal, Projektbörse, Backoffice)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
