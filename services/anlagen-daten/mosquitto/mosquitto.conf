# Mosquitto 2 mit go-auth (https://github.com/iegomez/mosquitto-go-auth), HTTP-Backend gegen den Ingest-Dienst.
# Kein anonymer Zugang, nur TLS (Port 8883), keine unverschlüsselten Listener.

per_listener_settings false
allow_anonymous false
persistence true
persistence_location /var/lib/mosquitto/
max_packet_size 16384
max_inflight_messages 100
max_queued_messages 5000
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /zertifikate/ca.crt
certfile /zertifikate/broker.crt
keyfile /zertifikate/broker.key
tls_version tlsv1.2
# Optional zusätzlich Client-Zertifikate je Datenlogger:
# require_certificate true
# use_identity_as_username false

# ---------------------------------------------------------------- go-auth → Dienst (internes Netz)
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host anlagen-daten
auth_opt_http_port 8081
auth_opt_http_getuser_uri /auth/user
auth_opt_http_superuser_uri /auth/superuser
auth_opt_http_aclcheck_uri /auth/acl
auth_opt_http_with_tls false
auth_opt_http_response_mode status
auth_opt_http_params_mode json
auth_opt_http_timeout 5
# Ergebnisse kurz zwischenspeichern (Sperren wirken spätestens nach 60 s bzw. beim nächsten Verbindungsaufbau)
auth_opt_cache true
auth_opt_cache_type go-cache
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60
auth_opt_log_level warn
